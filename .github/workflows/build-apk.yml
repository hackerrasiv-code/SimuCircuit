name: Build Android APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Unzip and Gradle
      run: sudo apt-get update && sudo apt-get install -y unzip gradle

    - name: Unzip project archive
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          
          if [ $(ls -A extracted_project | wc -l) -eq 1 ] && [ -d "extracted_project/$(ls -A extracted_project)" ]; then
            NESTED_DIR="extracted_project/$(ls -A extracted_project)"
            shopt -s dotglob
            mv "$NESTED_DIR"/* ./
            rm -rf "$NESTED_DIR"
          else
            shopt -s dotglob
            mv extracted_project/* ./
          fi
          rm -rf extracted_project "$ZIP_FILE"
        fi
        ls -la

    - name: Generate missing Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew is missing, generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
